        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const db = firebase.firestore();
                const salesList = document.getElementById('salesList');
                const summaryTableBody = document.getElementById('summaryTableBody');

                // Fonction pour charger les ventes filtrées par date
                function loadSalesByDateRange(startDate, endDate) {
                    db.collection("sales")
                        .where("date", ">=", startDate)
                        .where("date", "<=", endDate)
                        .get()
                        .then((querySnapshot) => {
                            let cumulativeSales = {};
                            let totalRevenue = 0;

                            salesList.innerHTML = '';
                            summaryTableBody.innerHTML = '';

                            querySnapshot.forEach((doc) => {
                                let sale = doc.data();

                                salesList.innerHTML += `
                        <div>
                            Facture ID: ${sale.factureId} - Total: ${sale.totalGdes.toFixed(2)} Gdes - Vendeur: ${sale.sellerName}
                        </div>
                    `;

                                sale.products.forEach(product => {
                                    if (!cumulativeSales[product.item]) {
                                        cumulativeSales[product.item] = {
                                            quantity: 0,
                                            price: product.price
                                        };
                                    }
                                    cumulativeSales[product.item].quantity += product.quantity;
                                    cumulativeSales[product.item].revenue = cumulativeSales[product.item].quantity * product.price;
                                });

                                totalRevenue += sale.totalGdes;
                            });

                            for (let item in cumulativeSales) {
                                summaryTableBody.innerHTML += `
                        <tr>
                            <td>${item}</td>
                            <td>${cumulativeSales[item].quantity}</td>
                            <td>${cumulativeSales[item].price.toFixed(2)} Gdes</td>
                            <td>${cumulativeSales[item].revenue.toFixed(2)} Gdes</td>
                        </tr>
                    `;
                            }

                            summaryTableBody.innerHTML += `
                    <tr>
                        <td colspan="3"><strong>Total</strong></td>
                        <td><strong>${totalRevenue.toFixed(2)} Gdes</strong></td>
                    </tr>
                `;
                        })
                        .catch((error) => {
                            console.error("Erreur lors du chargement des ventes :", error);
                        });
                }

                // Gérer le bouton de filtrage
                document.getElementById('filterButton').addEventListener('click', () => {
                    const startDate = document.getElementById('startDate').value;
                    const endDate = document.getElementById('endDate').value;

                    if (startDate && endDate) {
                        loadSalesByDateRange(startDate, endDate);
                    } else {
                        alert("Veuillez sélectionner un intervalle de dates.");
                    }
                });

                // Charger les ventes du jour lors du chargement initial
                const today = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
                loadSalesByDateRange(today, today);
            });
        </script>
