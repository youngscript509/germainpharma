<script>


    // Fonction pour gérer l'inscription de l'utilisateur
    function signup() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;


        // Créer un compte utilisateur avec l'e-mail et le mot de passe
        firebase.auth().createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Ajouter le nom de l'utilisateur à la collection 'users' dans Firestore
                const userId = userCredential.user.uid;
                firebase.firestore().collection('users').doc(userId).set({
                        name: name,
                        email: email,
                        role:role
                    })
                    .then(() => {
                        alert('Utilisateur enregistré avec succès.');
                        // Rediriger vers la page souhaitée après l'inscription

                    })
                    .catch((error) => {
                        console.error('Erreur lors de l\'enregistrement des données de l\'utilisateur:', error);
                        // Afficher un message d'erreur à l'utilisateur
                        alert('Erreur lors de l\'enregistrement. Veuillez réessayer.');
                    });
            })
            .catch((error) => {
                console.error('Erreur lors de l\'inscription de l\'utilisateur:', error);
                // Afficher un message d'erreur à l'utilisateur
                alert(error.message);
            });
    }
</script>
<script>

    // Fonction pour afficher les utilisateurs
    function loadUsers() {
        const usersTable = document.getElementById("usersTable");
        usersTable.innerHTML = ""; // Vider le tableau avant de recharger
        
        db.collection("users").get().then((querySnapshot) => {
            querySnapshot.forEach((doc) => {
                const user = doc.data();
                const userId = doc.id;

                const row = `<tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.role}</td>
                    <td>
                        <button onclick="deleteUser('${userId}', '${user.email}')">Supprimer</button>
                    </td>
                </tr>`;

                usersTable.innerHTML += row;
            });
        }).catch(error => {
            console.error("Erreur lors du chargement des utilisateurs:", error);
        });
    }

    // Fonction pour supprimer un utilisateur
    function deleteUser(userId, email) {
        if (confirm("Voulez-vous vraiment supprimer cet utilisateur ?")) {
            // Supprimer de Firestore
            db.collection("users").doc(userId).delete()
                .then(() => {
                    console.log("Utilisateur supprimé de Firestore");

                    // Supprimer de Firebase Auth
                    firebase.auth().signInWithEmailAndPassword(email, "mot_de_passe_temporaire")
                        .then(userCredential => {
                            userCredential.user.delete()
                                .then(() => {
                                    alert("Utilisateur supprimé avec succès !");
                                    loadUsers(); // Recharger la liste après suppression
                                })
                                .catch(error => console.error("Erreur lors de la suppression de l'utilisateur:", error));
                        })
                        .catch(error => console.error("Erreur d'authentification pour suppression:", error));
                })
                .catch(error => console.error("Erreur lors de la suppression de Firestore:", error));
        }
    }

    // Charger la liste au chargement de la page
    window.onload = loadUsers;
</script>
